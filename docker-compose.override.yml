services:
  
  # ---- Bases de datos ------------------------------
  
  postgres-userdb:
    container_name: userdb
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Sebastian@User123
      - POSTGRES_DB=user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-userdb-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres 
      -c password_encryption=md5
  
  postgres-recipedb:
    container_name: recipedb
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Sebastian@Recipe123
      - POSTGRES_DB=recipe_db
    ports:
      - "5436:5432"
    volumes:
      - postgres-recipedb-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres 
      -c password_encryption=md5

  postgres-ratingdb:
    container_name: ratingdb
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Sebastian@Rating123
      - POSTGRES_DB=rating_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-ratingdb-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres 
      -c password_encryption=md5

  postgres-notificationdb:
    container_name: notificationdb
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Sebastian@Notification123
      - POSTGRES_DB=notification_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-notificationdb-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres 
      -c password_encryption=md5

  redis:
    container_name: redis-cache
    ports: 
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq: 
    container_name: rabbitmq-broker
    environment: 
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=Sebastian@Rabbit123
      - RABBITMQ_DEFAULT_VHOST=/
    ports: 
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ----------- microservicios 

  user-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__RecipeUserDb=Host=postgres-userdb;Port=5432;Database=user_db;Username=admin;Password=Sebastian@User123;Include Error Detail=true
      - JwtSettings__Issuer=UserApi
      - JwtSettings__Audiences__0=UserClient
      - JwtSettings__Audiences__1=RecipeClient
      - JwtSettings__Audiences__2=RatingClient
      - JwtSettings__AccessTokenExpirationMinutes=300
      - JwtSettings__RefreshTokenExpirationDays=7
      - JwtSettings__RsaPrivateKey=-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
      - JwtSettings__RsaPublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
    ports:
      - "6000:8080"
    depends_on:
      postgres-userdb:
        condition: service_healthy

  recipe-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__RecipeDb=Host=postgres-recipedb;Port=5432;Database=recipe_db;Username=admin;Password=Sebastian@Recipe123;Include Error Detail=true
      - JwtSettings__Issuer=UserApi
      - JwtSettings__Audiences__0=UserClient
      - JwtSettings__Audiences__1=RecipeClient
      - JwtSettings__Audiences__2=RatingClient
      - JwtSettings__AccessTokenExpirationMinutes=300
      - JwtSettings__RefreshTokenExpirationDays=7
      - JwtSettings__RsaPublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=Sebastian@Rabbit123
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__RetryCount=5
    ports:
      - "6001:8080"
    depends_on:
      postgres-recipedb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rating-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__RatingDb=Host=postgres-ratingdb;Port=5432;Database=rating_db;Username=admin;Password=Sebastian@Rating123;Include Error Detail=true
      - JwtSettings__Issuer=UserApi
      - JwtSettings__Audiences__0=UserClient
      - JwtSettings__Audiences__1=RecipeClient
      - JwtSettings__Audiences__2=RatingClient
      - JwtSettings__AccessTokenExpirationMinutes=300
      - JwtSettings__RefreshTokenExpirationDays=7
      - JwtSettings__RsaPublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=Sebastian@Rabbit123
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__RetryCount=5
      - ServiceUrls__RecipesService=http://recipe-api:8080
      - ServiceUrls__NotificationService=http://notification-api:8080
      - HttpClientSettings__TimeoutSeconds=30
      - HttpClientSettings__RetryCount=3
      - HttpClientSettings__CircuitBreakerFailuresBeforeOpening=5
      - HttpClientSettings__CircuitBreakerDurationOfBreakSeconds=30
    ports:
      - "6002:8080"
    depends_on:
      postgres-ratingdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      recipe-api:
        condition: service_started

  recommendation-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - Redis__ConnectionString=redis:6379
      - ServicesUrls__UserServiceUrl=http://user-api:8080
      - ServicesUrls__RecipeServiceUrl=http://recipe-api:8080
      - ServicesUrls__RatingServiceUrl=http://rating-api:8080
      - HttpClientSettings__TimeoutSeconds=30
      - HttpClientSettings__RetryCount=3
      - HttpClientSettings__CircuitBreakerFailuresBeforeOpening=5
      - HttpClientSettings__CircuitBreakerDurationOfBreakSeconds=30
    ports:
      - "6003:8080"
    depends_on:
      redis:
        condition: service_healthy
      recipe-api:
        condition: service_started
      rating-api:
        condition: service_started
      user-api:
        condition: service_started

  notification-api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__NotificationDb=Host=postgres-notificationdb;Port=5432;Database=notification_db;Username=admin;Password=Sebastian@Notification123;Include Error Detail=true
      - JwtSettings__Issuer=UserApi
      - JwtSettings__Audiences__0=UserClient
      - JwtSettings__Audiences__1=RecipeClient
      - JwtSettings__Audiences__2=RatingClient
      - JwtSettings__AccessTokenExpirationMinutes=300
      - JwtSettings__RefreshTokenExpirationDays=7
      - JwtSettings__RsaPublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=Sebastian@Rabbit123
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__RetryCount=5
      - ServicesUrls__UserServiceUrl=http://user-api:8080
      - ServicesUrls__RecipeServiceUrl=http://recipe-api:8080
      - HttpClientSettings__TimeoutSeconds=30
      - HttpClientSettings__RetryCount=3
      - HttpClientSettings__CircuitBreakerFailuresBeforeOpening=5
      - HttpClientSettings__CircuitBreakerDurationOfBreakSeconds=30
    ports:
      - "6004:8080"
    depends_on:
      postgres-notificationdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      recipe-api:
        condition: service_started
      rating-api:
        condition: service_started

  apigateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - SwaggerAggregator__GatewayPublicUrl=http://localhost:6005
      - JwtSettings__Issuer=UserApi
      - JwtSettings__Audiences__0=UserClient
      - JwtSettings__Audiences__1=RecipeClient
      - JwtSettings__Audiences__2=RatingClient
      - JwtSettings__Audiences__3=NotificationClient
      - JwtSettings__RsaPublicKey=-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      # YARP destinos
      - ReverseProxy__Clusters__users-cluster__Destinations__users-primary__Address=http://user-api:8080
      - ReverseProxy__Clusters__recipes-cluster__Destinations__recipes-primary__Address=http://recipe-api:8080
      - ReverseProxy__Clusters__ratings-cluster__Destinations__ratings-primary__Address=http://rating-api:8080
      - ReverseProxy__Clusters__recommendations-cluster__Destinations__recommendations-primary__Address=http://recommendation-api:8080
      - ReverseProxy__Clusters__notifications-cluster__Destinations__notifications-primary__Address=http://notification-api:8080
      # YARP health checks
      - ReverseProxy__Clusters__users-cluster__HealthCheck__Active__Path=/health
      - ReverseProxy__Clusters__recipes-cluster__HealthCheck__Active__Path=/health
      - ReverseProxy__Clusters__ratings-cluster__HealthCheck__Active__Path=/health
      - ReverseProxy__Clusters__recommendations-cluster__HealthCheck__Active__Path=/health
      - ReverseProxy__Clusters__notifications-cluster__HealthCheck__Active__Path=/health
      # HealthChecks UI
      - HealthChecksUi__HealthChecks__0__Name=User Service
      - HealthChecksUi__HealthChecks__0__Uri=http://user-api:8080/health
      - HealthChecksUi__HealthChecks__1__Name=Recipe Service
      - HealthChecksUi__HealthChecks__1__Uri=http://recipe-api:8080/health
      - HealthChecksUi__HealthChecks__2__Name=Rating Service
      - HealthChecksUi__HealthChecks__2__Uri=http://rating-api:8080/health
      - HealthChecksUi__HealthChecks__3__Name=Recommendation Service
      - HealthChecksUi__HealthChecks__3__Uri=http://recommendation-api:8080/health
      - HealthChecksUi__HealthChecks__4__Name=Notification Service
      - HealthChecksUi__HealthChecks__4__Uri=http://notification-api:8080/health
      # Swagger
      - SwaggerAggregator__Services__0__Name=users-service
      - SwaggerAggregator__Services__0__DisplayName=Users Service
      - SwaggerAggregator__Services__0__SwaggerUrl=http://user-api:8080/swagger/v1/swagger.json
      - SwaggerAggregator__Services__1__Name=recipe-service
      - SwaggerAggregator__Services__1__DisplayName=Recipe Service
      - SwaggerAggregator__Services__1__SwaggerUrl=http://recipe-api:8080/swagger/v1/swagger.json
      - SwaggerAggregator__Services__2__Name=rating-service
      - SwaggerAggregator__Services__2__DisplayName=Rating Service
      - SwaggerAggregator__Services__2__SwaggerUrl=http://rating-api:8080/swagger/v1/swagger.json
      - SwaggerAggregator__Services__3__Name=recommendation-service
      - SwaggerAggregator__Services__3__DisplayName=Recommendation Service
      - SwaggerAggregator__Services__3__SwaggerUrl=http://recommendation-api:8080/swagger/v1/swagger.json
      - SwaggerAggregator__Services__4__Name=notification-service
      - SwaggerAggregator__Services__4__DisplayName=Notification Service
      - SwaggerAggregator__Services__4__SwaggerUrl=http://notification-api:8080/swagger/v1/swagger.json
    ports:
      - "6005:8080"
    depends_on:
      - user-api
      - recipe-api
      - rating-api
      - recommendation-api
      - notification-api

volumes:
  postgres-userdb-data:
    driver: local
  postgres-recipedb-data:
    driver: local
  postgres-ratingdb-data:
    driver: local
  postgres-notificationdb-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

